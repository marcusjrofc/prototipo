<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telão - Dilemas Éticos</title>
    <!-- Tailwind para utilitários -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Arquivo CSS Único -->
    <link rel="stylesheet" href="./style.css">
</head>
<body class="index-body">
    
    <div class="projection-card glass-effect">
        <h1 class="title-main">Dilemas Filosóficos</h1>
        <p class="subtitle-main">Você decide o destino! Escaneie o QR Code para jogar.</p>
        
        <div class="code-container">
            <!-- Box do QR Code -->
            <div class="qr-wrapper">
                <img id="dynamic-qr" src="" alt="QR Code" class="qr-image">
            </div>
            
            <!-- Box do PIN -->
            <div class="pin-wrapper">
                <p class="pin-label">Código da Sala</p>
                <div class="pin-display">784 321</div>
            </div>
        </div>
    </div>

    <script>
        // Gera o link dinâmico para a página do aluno
        const currentUrl = window.location.href.split('index.html')[0]; 
        const playerUrl = currentUrl + "player.html";
        
        // Cria o QR Code
        const qrImage = document.getElementById('dynamic-qr');
        qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(playerUrl)}`;
    </script>
</body>
</html>
